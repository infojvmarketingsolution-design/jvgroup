name: Daily 6:00 AM AI SEO Blog Publisher

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST (Indian Standard Time is UTC + 5:30)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  publish-daily-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Blog Generation Engine
        run: |
          node scripts/generate-daily-blog.mjs

      - name: Commit and Push New Morning Blog Post
        run: |
          git config --global user.name "JV Group AI Editorial Bot"
          git config --global user.email "bot@jvgroupco.in"
          git add -A
          if git diff --staged --quiet; then
            echo "No new blog changes to commit today."
          else
            git commit -m "chore(blog): auto-publish morning 6:00 AM AI SEO blog post [skip ci]"
            git push
          fi
